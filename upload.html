<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fine - Upload Lab Results</title>
    <style>
      body {
        background-color: #ccdbd6;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        padding: 20px;
      }
      .upload-container {
        background: white;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      h2 {
        margin-bottom: 15px;
        font-weight: 700;
      }
      .upload-area {
        border: 2px dashed #5a7a72;
        padding: 40px 20px;
        border-radius: 10px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin-bottom: 15px;
      }
      .upload-area:hover {
        background-color: #e7f0ed;
      }
      input[type="file"] {
        display: none;
      }
      .file-name {
        margin-top: 10px;
        font-style: italic;
        color: #555;
      }
      .upload-btn {
        background-color: #3a6b64;
        border: none;
        color: white;
        padding: 12px 28px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.25s ease;
        margin-top: 10px;
      }
      .upload-btn:hover {
        background-color: #2c524b;
      }
      .note {
        font-size: 13px;
        color: #777;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="upload-container">
      <h2>Upload Your Lab Results</h2>

      <label for="fileUpload" class="upload-area" id="uploadArea">
        Drag & Drop or Click to Browse
      </label>

      <input type="file" id="fileUpload" accept=".pdf,.jpg,.jpeg,.png,.txt" />

      <div class="file-name" id="fileName">No file chosen</div>

      <button class="upload-btn" id="uploadBtn" disabled>Upload</button>

      <div class="note">🔐 Your data is private & secure</div>
    </div>

    <script>
        const fileInput = document.getElementById('fileUpload');
        const uploadArea = document.getElementById('uploadArea');
        const fileNameDisplay = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');

        uploadArea.addEventListener('click', () => {
          fileInput.click();
        });

        fileInput.addEventListener('change', () => {
          if (fileInput.files.length > 0) {
            fileNameDisplay.textContent
            <script>
      // Handle drag and drop style feedback
      uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.style.backgroundColor = '#d4ebe5';
      });

      uploadArea.addEventListener('dragleave', (e) => {
        e.preventDefault();
        uploadArea.style.backgroundColor = '';
      });

      uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.style.backgroundColor = '';

        if (e.dataTransfer.files.length > 0) {
          const file = e.dataTransfer.files[0];
          const allowedTypes = ['application/pdf', 'image/jpeg', 'image/png', 'text/plain'];

          if (allowedTypes.includes(file.type)) {
            fileInput.files = e.dataTransfer.files;
            fileNameDisplay.textContent = file.name;
            uploadBtn.disabled = false;
          } else {
            alert('Unsupported file type! Please upload PDF, JPG, PNG or TXT.');
          }
        }
      });

      // Simulate upload process on button click
      uploadBtn.addEventListener('click', () => {
        uploadBtn.textContent = 'Uploading...';
        uploadBtn.disabled = true;
        // Simulate a 2-second upload
        setTimeout(() => {
          alert(`File "${fileInput.files[0].name}" uploaded successfully!`);
          uploadBtn.textContent = 'Upload';
          fileNameDisplay.textContent = 'No file chosen';
          fileInput.value = '';
        }, 2000);
      });
    </script>
  </body>
</html>
